[project]
name = "exjet-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pypdf>=4.2",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "tzdata>=2024.1",
  "exjet-product",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exjet_api"]

[tool.uv.sources]
exjet-product = { path = "../../product", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "reportlab>=4.2"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../product/tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501", "E741", "UP042"]  # E501: formatter-owned; B008: FastAPI Depends()/File()/Form() in defaults is the framework's idiom

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env vars must be set before exjet_api is imported
