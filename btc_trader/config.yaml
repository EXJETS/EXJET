# ─── BTC Algorithmic Trading System Configuration ────────────────────────────

binance:
  symbol: "BTCUSDT"
  futures_symbol: "BTCUSDT"
  timeframes: ["1m", "5m", "15m", "1h", "4h", "1d"]
  lookback_bars: 500          # bars per timeframe for initial load
  reconnect_delay: 5          # seconds between reconnect attempts

# ─── Strategy Toggles ────────────────────────────────────────────────────────
strategies:
  scalp:
    enabled: true
    timeframes: ["1m", "5m"]
    signal_timeframe: "5m"
    confirm_timeframes: ["15m", "1h"]
    target_pct_min: 0.3
    target_pct_max: 0.8
    min_confluence_score: 68
    atr_stop_multiplier: 1.2

  day:
    enabled: true
    timeframes: ["15m", "1h"]
    signal_timeframe: "1h"
    confirm_timeframes: ["4h"]
    target_pct_min: 1.0
    target_pct_max: 3.0
    min_confluence_score: 65
    atr_stop_multiplier: 1.5

  swing:
    enabled: true
    timeframes: ["4h", "1d"]
    signal_timeframe: "4h"
    confirm_timeframes: ["1d"]
    target_pct_min: 5.0
    target_pct_max: 20.0
    min_confluence_score: 60
    atr_stop_multiplier: 2.0

# ─── Statistical Thresholds ──────────────────────────────────────────────────
statistics:
  zscore_window: 20
  zscore_entry_threshold: 2.0      # |z-score| > 2 triggers mean-reversion
  zscore_extreme_threshold: 3.0    # |z-score| > 3 adds extra weight
  hurst_window: 100                # bars for Hurst calculation
  hurst_trending_threshold: 0.55   # H > 0.55 → trending
  hurst_ranging_threshold: 0.45    # H < 0.45 → mean-reverting
  adx_trending_threshold: 25
  adx_strong_trend: 40
  atr_window: 14
  rsi_window: 14
  rsi_overbought: 70
  rsi_oversold: 30
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_window: 20
  bb_std: 2.0
  volume_ma_window: 20
  volume_spike_multiplier: 1.5     # volume > 1.5x MA = spike

# ─── Market Structure ────────────────────────────────────────────────────────
market_structure:
  swing_lookback: 5       # bars each side to define swing point
  ob_lookback: 3          # candles before a strong move to define OB
  fvg_min_size_atr: 0.3   # FVG must be > 0.3 ATR to count
  bos_lookback: 20        # bars to look back for BOS confirmation

# ─── Behavioral Overlay ──────────────────────────────────────────────────────
behavioral:
  liquidity_sweep_lookback: 30    # bars to track swing levels for sweeps
  liquidity_retest_bars: 5        # bars after sweep to confirm fade
  round_number_proximity_pct: 0.1 # within 0.1% of round number counts
  funding_extreme_threshold: 0.01 # |funding_rate| > 0.01% = extreme
  fear_greed_extreme_low: 20
  fear_greed_extreme_high: 80
  fear_greed_refresh_minutes: 60  # how often to re-fetch F&G

# ─── Confluence Scoring Weights (must sum to 100) ────────────────────────────
confluence:
  weights:
    htf_trend: 20         # higher-timeframe trend alignment
    momentum: 15          # RSI, MACD, stoch
    volume: 15            # volume confirmation
    market_structure: 20  # BOS, CHoCH, OB, FVG
    behavioral: 20        # liquidity, funding, F&G, round numbers
    statistical: 10       # z-score, regime
  min_score_fire: 65      # overall minimum to fire any alert
  counter_trend_penalty: 20  # subtract from score for counter-trend

# ─── Risk Management ─────────────────────────────────────────────────────────
risk:
  kelly_fraction: 0.25        # Quarter Kelly
  kelly_max_position: 0.10    # never risk > 10% of capital on one trade
  drawdown_pause_threshold: 0.10   # pause alerts after 10% drawdown
  drawdown_reduce_threshold: 0.07  # reduce size after 7% drawdown
  consecutive_loss_pause: 4        # pause after 4 consecutive losses
  size_reduction_after_losses: 0.5 # halve size after 3 losses
  tp1_rr: 1.5                 # TP1 at 1.5R
  tp2_rr: 3.0                 # TP2 at 3.0R

# ─── Backtesting ─────────────────────────────────────────────────────────────
backtesting:
  start_date: "2022-01-01"
  end_date: "2024-06-01"
  initial_capital: 10000.0
  fee_rate: 0.001             # 0.1% taker fee (Binance standard)
  slippage_pct: 0.0005        # 0.05% slippage estimate
  monte_carlo_simulations: 1000
  walk_forward_n_splits: 6
  walk_forward_train_pct: 0.7 # 70% train / 30% OOS per fold
  min_trades_valid: 30        # minimum trades to trust a backtest

# ─── Alerts ──────────────────────────────────────────────────────────────────
alerts:
  telegram_enabled: true
  cooldown_minutes: 15        # min minutes between same-strategy alerts
  max_alerts_per_hour: 10

# ─── Paper Trading ───────────────────────────────────────────────────────────
paper_trading:
  enabled: true
  initial_balance: 10000.0
  fee_rate: 0.001
  slippage_pct: 0.0005
  track_file: "data/paper_trades.csv"

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  file: "logs/btc_trader.log"
  rotation: "50 MB"
  retention: "30 days"
