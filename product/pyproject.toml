[project]
name = "exjet-product"
version = "0.1.0"
description = "EXJET marketplace mechanics as deterministic, database-free Python services."
requires-python = ">=3.12"
dependencies = ["pypdf>=4.2", "tzdata>=2024.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exjet_product"]

[tool.ruff]
line-length = 110
