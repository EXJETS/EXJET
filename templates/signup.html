{% extends 'base.html' %}{% from '_m.html' import csrf_i, apt %}{% block body %}<div class="stack narrow" style="padding-top:24px"><h1>Create your account</h1>
<form method="post" class="stack">{{ csrf_i(csrf) }}
<label class="f"><span class="cap">Full legal name</span><input name="full_name" autocomplete="name" required value="{{ request.form.get('full_name','') }}"></label>
<label class="f"><span class="cap">Email</span><input type="email" name="email" autocomplete="email" required value="{{ request.form.get('email','') }}"></label>
<label class="f"><span class="cap">Mobile phone</span><input type="tel" name="phone" autocomplete="tel" required value="{{ request.form.get('phone','') }}"></label>
<label class="f"><span class="cap">Password, 10 characters or more</span><input type="password" name="password" autocomplete="new-password" minlength="10" required></label>
<label class="f"><span class="cap">Account type</span><select name="account_type"><option value="individual">Individual</option><option value="business">Business</option></select></label>
<label class="k"><input type="checkbox" name="age" value="1" required>I am 18 or older.</label>
<label class="k top"><input type="checkbox" name="terms" value="1" required><span>I agree to the <a href="/legal/terms">Terms of Service</a> and <a href="/legal/privacy">Privacy Policy</a>, and to sign and receive records electronically.</span></label><input type="hidden" name="esign" value="1">
<label class="k top"><input type="checkbox" name="release" value="1" required><span class="rel">{{ RELEASE }}</span></label>
<label class="k top"><input type="checkbox" name="arbitration" value="1" required><span>I agree to binding individual arbitration and waive class actions and jury trial, as set out in the Terms.</span></label>
<label class="k top"><input type="checkbox" name="marketing" value="1"><span>Send me offers by email and text. Optional. Message rates may apply.</span></label>
<button class="pri block">Create account</button><p class="m s">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></form></div>{% endblock %}
